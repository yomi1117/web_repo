<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gyx是第一美女</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">gyx是第一美女</div>
            <ul class="nav-links">
                <li><a href="#home">首页</a></li>
                <li><a href="#about">关于</a></li>
                <li><a href="#services">服务</a></li>
                <li><a href="#contact">联系我们</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home" class="hero">
            <h1>欢迎来到我的网站</h1>
            <p>这是一个现代化的响应式网站示例</p>
            <button class="cta-button">了解更多</button>
        </section>

        <section id="about" class="about">
            <h2>关于我们</h2>
            <div class="about-content">
                <p>我们是一个充满激情的团队，致力于创造优秀的数字体验。</p>
            </div>
        </section>

        <section id="services" class="services">
            <h2>我们的服务</h2>
            <div class="service-grid">
                <div class="service-card">
                    <h3>网站开发</h3>
                    <p>专业的网站开发服务</p>
                </div>
                <div class="service-card">
                    <h3>UI/UX 设计</h3>
                    <p>创新的用户界面设计</p>
                </div>
                <div class="service-card">
                    <h3>数字营销</h3>
                    <p>全方位的数字营销解决方案</p>
                </div>
            </div>
        </section>

        <section id="contact" class="contact">
            <h2>联系我们</h2>
            <form id="contact-form">
                <input type="text" id="name" placeholder="您的姓名" required>
                <input type="email" id="email" placeholder="您的邮箱" required>
                <textarea id="message" placeholder="您的留言" required></textarea>
                <button type="submit">发送消息</button>
            </form>
            <div id="message-status"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 我的网站. 保留所有权利。</p>
    </footer>

    <script>
        document.getElementById('contact-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            const statusDiv = document.getElementById('message-status');

            try {
                const response = await fetch('http://localhost:3000/api/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, email, message })
                });

                const data = await response.json();
                
                if (data.success) {
                    statusDiv.textContent = '留言发送成功！';
                    statusDiv.style.color = 'green';
                    document.getElementById('contact-form').reset();
                } else {
                    throw new Error('发送失败');
                }
            } catch (error) {
                statusDiv.textContent = '留言发送失败，请稍后重试';
                statusDiv.style.color = 'red';
            }
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
